<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATG + BTB Workout Tracker</title>
    <!-- PWA Manifest & Meta -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATG Tracker">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-dark-text min-h-screen font-sans antialiased pb-24 select-none">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-dark-card/90 backdrop-blur-md border-b border-dark-border px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    <span>⚡</span> ATG + BTB Logger
                </h1>
                <p class="text-xs text-dark-muted" id="header-subtitle">Select your workout day</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportCSV()" class="px-2.5 py-1.5 bg-dark-border hover:bg-slate-700 text-white rounded-lg text-xs font-medium transition active:scale-95 flex items-center gap-1">
                    <span>📥</span> CSV
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Day Selector Tabs -->
        <div class="grid grid-cols-3 gap-2 mb-5 bg-dark-card p-1.5 rounded-2xl border border-dark-border">
            <button onclick="switchDay('monday')" id="tab-monday" class="py-2.5 text-xs font-bold rounded-xl transition text-center shadow-sm">Monday</button>
            <button onclick="switchDay('thursday')" id="tab-thursday" class="py-2.5 text-xs font-bold rounded-xl transition text-center shadow-sm">Thursday</button>
            <button onclick="switchDay('friday')" id="tab-friday" class="py-2.5 text-xs font-bold rounded-xl transition text-center shadow-sm">Friday</button>
        </div>

        <!-- Workout Routine Container -->
        <div id="exercise-list" class="space-y-3.5">
            <!-- Dynamically populated -->
        </div>

    </main>

    <!-- Rest Timer Floating Card -->
    <div id="timer-card" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900/95 backdrop-blur-xl border border-sky-500/30 rounded-2xl p-3 shadow-2xl z-50 flex items-center justify-between hidden transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-lg" id="timer-display">90</div>
            <div>
                <p class="text-xs font-semibold text-white" id="timer-label">Rest Timer</p>
                <p class="text-[10px] text-dark-muted">Tap to adjust</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="adjustTimer(-15)" class="w-8 h-8 rounded-lg bg-dark-border text-white text-xs font-bold active:scale-95">-15s</button>
            <button onclick="adjustTimer(15)" class="w-8 h-8 rounded-lg bg-dark-border text-white text-xs font-bold active:scale-95">+15s</button>
            <button onclick="stopTimer()" class="px-3 h-8 rounded-lg bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 text-xs font-bold active:scale-95">Stop</button>
        </div>
    </div>

    <!-- Log Modal -->
    <div id="log-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-base font-bold text-white" id="modal-exercise-title">Exercise Name</h3>
                    <p class="text-xs text-dark-muted" id="modal-exercise-target">Target: 3 × 8-10</p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-dark-border/50 text-dark-muted hover:text-white flex items-center justify-center text-sm font-bold">✕</button>
            </div>

            <div id="last-log-hint" class="mb-4 bg-dark-bg/60 border border-dark-border rounded-xl p-2.5 text-xs text-sky-400 flex items-center justify-between hidden">
                <span id="last-log-text">Last recorded: --</span>
                <button onclick="applyLastLog()" class="underline font-semibold hover:text-sky-300">Use Last</button>
            </div>

            <form id="log-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="form-exercise-id">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1 uppercase tracking-wider">Weight (kg)</label>
                        <input type="number" step="0.5" id="form-weight" required placeholder="e.g. 18" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-3 text-white text-base font-semibold focus:outline-none focus:border-sky-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-dark-muted mb-1 uppercase tracking-wider">Reps</label>
                        <input type="number" id="form-reps" required placeholder="e.g. 10" class="w-full bg-dark-bg border border-dark-border rounded-xl px-3.5 py-3 text-white text-base font-semibold focus:outline-none focus:border-sky-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-dark-muted mb-1 uppercase tracking-wider">Rest Timer</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" onclick="setPresetTimer(45, this)" class="timer-btn py-2 rounded-xl bg-dark-bg border border-dark-border text-xs font-semibold hover:border-sky-500 text-dark-muted">45s</button>
                        <button type="button" onclick="setPresetTimer(60, this)" class="timer-btn py-2 rounded-xl bg-dark-bg border border-dark-border text-xs font-semibold hover:border-sky-500 text-dark-muted">60s</button>
                        <button type="button" onclick="setPresetTimer(90, this)" class="timer-btn py-2 rounded-xl bg-sky-500/20 border border-sky-500 text-sky-400 text-xs font-semibold">90s</button>
                        <button type="button" onclick="setPresetTimer(120, this)" class="timer-btn py-2 rounded-xl bg-dark-bg border border-dark-border text-xs font-semibold hover:border-sky-500 text-dark-muted">120s</button>
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-bold text-sm shadow-lg shadow-sky-600/30 transition active:scale-98">
                        Save Set & Start Timer ⏱️
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Info / Video Modal -->
    <div id="info-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-base font-bold text-white flex items-center gap-2" id="info-modal-title">Exercise Guide</h3>
                <button onclick="closeInfoModal()" class="w-8 h-8 rounded-full bg-dark-border/50 text-dark-muted hover:text-white flex items-center justify-center text-sm font-bold">✕</button>
            </div>
            
            <div class="space-y-3 mb-5">
                <div class="bg-dark-bg/60 border border-dark-border rounded-xl p-3">
                    <h4 class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-1">ATG Form Cues</h4>
                    <p class="text-xs text-dark-text leading-relaxed" id="info-modal-cues">Focus on full range of motion, controlled eccentric tempo, and tendon stretch.</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <a id="info-yt-link" href="#" target="_blank" class="py-2.5 px-3 bg-rose-600/20 border border-rose-500/40 hover:bg-rose-600/30 text-rose-300 rounded-xl text-xs font-bold text-center flex items-center justify-center gap-1.5 transition">
                    <span>▶️</span> YouTube Demo
                </a>
                <a id="info-google-link" href="#" target="_blank" class="py-2.5 px-3 bg-sky-600/20 border border-sky-500/40 hover:bg-sky-600/30 text-sky-300 rounded-xl text-xs font-bold text-center flex items-center justify-center gap-1.5 transition">
                    <span>🔍</span> Google Search
                </a>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        const workouts = {
            monday: {
                title: "Monday: Lower & Upper Base",
                exercises: [
                    { id: "m1", name: "Backward Sled / Walk", target: "5 mins", starter: "Light / Bodyweight", cues: "Keep core tight, push through balls of feet or pull sled smoothly. Continuous aerobic pace." },
                    { id: "m2", name: "Tibialis Raises", target: "2 × 15-20", starter: "Light bar / Bodyweight", cues: "Full dorsiflexion. Bring toes all the way up toward shins with controlled lowering." },
                    { id: "m3", name: "Slant Board Calf Raises", target: "2 × 15", starter: "Bodyweight", cues: "Full stretch at bottom, pause 1 second, explode up to peak plantarflexion." },
                    { id: "m4", name: "Poliquin / Patrick Step-Ups", target: "2 × 12-15", starter: "Bodyweight / light DBs", cues: "Knee travels forward over toe. Control the descent and tap heel lightly." },
                    { id: "m5", name: "DB Incline Bench Press", target: "3 × 6-8", starter: "16-20 kg DBs", cues: "Full stretch at bottom, elbows at ~45 degrees, press with control." },
                    { id: "m6", name: "Heel-Elevated Goblet Squats", target: "3 × 8-10", starter: "16-24 kg Kettlebell", cues: "Upright torso, deep ATG depth, knees tracking over toes." },
                    { id: "m7", name: "Overhead DB Shoulder Press", target: "3 × 8-10", starter: "14-16 kg DBs", cues: "Full range from shoulders to overhead lock without arching lower back." },
                    { id: "m8", name: "Triceps Overhead Extension", target: "3 × 10-12", starter: "12-16 kg DB/Cable", cues: "Keep elbows pointed up and close to head for deep tricep stretch." },
                    { id: "m9", name: "Couch Stretch", target: "2 × 45s/side", starter: "Bodyweight", cues: "Knee tight against wall, glute squeezed, hip flexor and quad open." }
                ]
            },
            thursday: {
                title: "Thursday: Knees & Upper Volume",
                exercises: [
                    { id: "t1", name: "Backward Sled / Walk", target: "5 mins", starter: "Light / Bodyweight", cues: "Smooth continuous motion to flush blood into the knees." },
                    { id: "t2", name: "Tibialis Raises", target: "2 × 15-20", starter: "Light bar / Bodyweight", cues: "Full contraction on every rep. Burn in the shin is normal." },
                    { id: "t3", name: "Slant Board Calf Raises", target: "2 × 15", starter: "Bodyweight", cues: "Deep stretch at bottom, pause before driving up." },
                    { id: "t4", name: "Poliquin / Patrick Step-Ups", target: "2 × 12-15", starter: "Bodyweight / light DBs", cues: "Control descent, keep heel anchored on slant/step." },
                    { id: "t5", name: "DB Bench Press (Flat)", target: "3 × 6-8", starter: "18-22 kg DBs", cues: "Shoulder blades retracted, full chest stretch." },
                    { id: "t6", name: "ATG Split Squat", target: "3 × 5-8/side", starter: "Bodyweight / Light DBs", cues: "Front knee over toe, back knee fully flexed, hip crease below knee." },
                    { id: "t7", name: "Seated DB Shoulder Press", target: "3 × 8-10", starter: "14-16 kg DBs", cues: "Strict form, smooth reversal at bottom." },
                    { id: "t8", name: "Biceps Curls", target: "3 × 10-12", starter: "12-14 kg DBs", cues: "Full extension at bottom, squeeze biceps at top." },
                    { id: "t9", name: "Elephant Walk / Hamstring Stretch", target: "2 × 1m", starter: "Bodyweight", cues: "Hinged forward fold, alternating knee bends to stretch hamstrings." }
                ]
            },
            friday: {
                title: "Friday: Posterior Chain & Strength",
                exercises: [
                    { id: "f1", name: "Backward Sled / Walk", target: "5 mins", starter: "Light / Bodyweight", cues: "Warm-up knees and lower body tissues." },
                    { id: "f2", name: "Tibialis Raises", target: "2 × 15-20", starter: "Light bar / Bodyweight", cues: "High rep endurance for shin muscles." },
                    { id: "f3", name: "Slant Board Calf Raises", target: "2 × 15", starter: "Bodyweight", cues: "Full range calf isolation." },
                    { id: "f4", name: "ATG Lunges / Step-Ups", target: "2 × 12-15", starter: "Bodyweight / light DBs", cues: "Deep knee bend and hip opening." },
                    { id: "f5", name: "DB Rows / Chest Supported Rows", target: "3 × 8-10", starter: "18-24 kg DBs", cues: "Pull to hip, squeeze upper back, controlled negative." },
                    { id: "f6", name: "RDL (Romanian Deadlifts)", target: "3 × 8-10", starter: "40-60 kg Barbell / DBs", cues: "Hips back, flat back, intense hamstring stretch." },
                    { id: "f7", name: "Lat Pulldowns / Pull-ups", target: "3 × 8-10", starter: "Moderate / Bodyweight", cues: "Drive elbows down, chest proud." },
                    { id: "f8", name: "Face Pulls", target: "3 × 15", starter: "Light Cable", cues: "Pull to eyes, external rotation for shoulder health." },
                    { id: "f9", name: "Pancake / LCL Stretch", target: "2 × 1m", starter: "Bodyweight", cues: "Adductor and lower back mobility." }
                ]
            }
        };

        let currentDay = 'monday';
        let workoutLogs = JSON.parse(localStorage.getItem('atg_workout_logs') || '{}');
        let selectedTimerSeconds = 90;
        let activeTimerInterval = null;
        let remainingSeconds = 0;

        function init() {
            const savedDay = localStorage.getItem('atg_current_day');
            if (savedDay && workouts[savedDay]) {
                currentDay = savedDay;
            }
            renderDay();
        }

        function switchDay(day) {
            currentDay = day;
            localStorage.setItem('atg_current_day', day);
            renderDay();
        }

        function renderDay() {
            ['monday', 'thursday', 'friday'].forEach(d => {
                const btn = document.getElementById('tab-' + d);
                if (d === currentDay) {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl transition text-center shadow-sm bg-sky-600 text-white shadow-sky-600/30";
                } else {
                    btn.className = "py-2.5 text-xs font-bold rounded-xl transition text-center text-dark-muted hover:text-white";
                }
            });

            const routine = workouts[currentDay];
            document.getElementById('header-subtitle').textContent = routine.title;

            const listContainer = document.getElementById('exercise-list');
            listContainer.innerHTML = '';

            routine.exercises.forEach((ex, index) => {
                const logs = workoutLogs[ex.id] || [];
                let historyHtml = '';
                if (logs.length > 0) {
                    const recent = logs.slice(-3).reverse();
                    const chips = recent.map(l => '<span class="px-2 py-0.5 bg-dark-bg border border-dark-border rounded-md text-[11px] font-semibold text-sky-400">' + l.weight + 'kg × ' + l.reps + '</span>').join('');
                    historyHtml = '<div class="mt-2.5 pt-2 border-t border-dark-border/60 flex flex-wrap gap-1.5 items-center"><span class="text-[10px] uppercase font-bold text-dark-muted">Recent:</span>' + chips + '</div>';
                }

                const card = document.createElement('div');
                card.className = "bg-dark-card border border-dark-border rounded-2xl p-4 shadow-sm transition hover:border-slate-700";
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2">
                                <span class="text-xs font-bold text-sky-500 bg-sky-500/10 px-2 py-0.5 rounded-md">#${index + 1}</span>
                                <h3 class="text-sm font-bold text-white truncate">${ex.name}</h3>
                            </div>
                            <div class="flex items-center gap-3 mt-1.5 text-xs text-dark-muted">
                                <span class="text-slate-300 font-medium">🎯 ${ex.target}</span>
                                <span>💡 ${ex.starter}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5">
                            <button onclick="openInfoModal('${encodeURIComponent(ex.name)}', '${encodeURIComponent(ex.cues)}')" class="px-2.5 py-2 bg-dark-border/60 hover:bg-dark-border text-dark-muted hover:text-white rounded-xl text-xs font-semibold transition active:scale-95 flex items-center gap-1">
                                <span>ℹ️</span> Guide
                            </button>
                            <button onclick="openLogModal('${ex.id}', '${encodeURIComponent(ex.name)}', '${ex.target}')" class="px-3.5 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-xs font-bold transition active:scale-95 shadow-sm shadow-sky-600/30 flex items-center gap-1">
                                <span>⚡</span> Log
                            </button>
                        </div>
                    </div>
                    ${historyHtml}
                `;
                listContainer.appendChild(card);
            });
        }

        function openLogModal(id, name, target) {
            document.getElementById('form-exercise-id').value = id;
            document.getElementById('modal-exercise-title').textContent = decodeURIComponent(name);
            document.getElementById('modal-exercise-target').textContent = 'Target: ' + target;
            
            const logs = workoutLogs[id] || [];
            const hintBox = document.getElementById('last-log-hint');
            if (logs.length > 0) {
                const last = logs[logs.length - 1];
                document.getElementById('last-log-text').textContent = 'Last: ' + last.weight + 'kg × ' + last.reps + ' reps';
                hintBox.classList.remove('hidden');
            } else {
                hintBox.classList.add('hidden');
            }

            document.getElementById('form-weight').value = '';
            document.getElementById('form-reps').value = '';
            document.getElementById('log-modal').classList.remove('hidden');
            document.getElementById('form-weight').focus();
        }

        function closeModal() {
            document.getElementById('log-modal').classList.add('hidden');
        }

        function applyLastLog() {
            const id = document.getElementById('form-exercise-id').value;
            const logs = workoutLogs[id] || [];
            if (logs.length > 0) {
                const last = logs[logs.length - 1];
                document.getElementById('form-weight').value = last.weight;
                document.getElementById('form-reps').value = last.reps;
            }
        }

        function openInfoModal(name, cues) {
            const decodedName = decodeURIComponent(name);
            const decodedCues = decodeURIComponent(cues);
            document.getElementById('info-modal-title').textContent = decodedName;
            document.getElementById('info-modal-cues').textContent = decodedCues;

            document.getElementById('info-yt-link').href = 'https://www.youtube.com/results?search_query=ATG+' + encodeURIComponent(decodedName);
            document.getElementById('info-google-link').href = 'https://www.google.com/search?q=' + encodeURIComponent(decodedName + ' exercise form ATG');

            document.getElementById('info-modal').classList.remove('hidden');
        }

        function closeInfoModal() {
            document.getElementById('info-modal').classList.add('hidden');
        }

        function setPresetTimer(secs, btnEl) {
            selectedTimerSeconds = secs;
            document.querySelectorAll('.timer-btn').forEach(btn => {
                btn.className = "timer-btn py-2 rounded-xl bg-dark-bg border border-dark-border text-xs font-semibold hover:border-sky-500 text-dark-muted";
            });
            btnEl.className = "timer-btn py-2 rounded-xl bg-sky-500/20 border border-sky-500 text-sky-400 text-xs font-semibold";
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('form-exercise-id').value;
            const weight = parseFloat(document.getElementById('form-weight').value);
            const reps = parseInt(document.getElementById('form-reps').value);

            if (!workoutLogs[id]) workoutLogs[id] = [];
            workoutLogs[id].push({
                date: new Date().toISOString(),
                day: currentDay,
                weight: weight,
                reps: reps
            });

            localStorage.setItem('atg_workout_logs', JSON.stringify(workoutLogs));
            closeModal();
            renderDay();

            startRestTimer(selectedTimerSeconds);
        }

        function startRestTimer(seconds) {
            if (activeTimerInterval) clearInterval(activeTimerInterval);
            remainingSeconds = seconds;
            
            const card = document.getElementById('timer-card');
            card.classList.remove('hidden');
            updateTimerDisplay();

            activeTimerInterval = setInterval(() => {
                remainingSeconds--;
                updateTimerDisplay();
                if (remainingSeconds <= 0) {
                    clearInterval(activeTimerInterval);
                    card.classList.add('hidden');
                    playBeep();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(remainingSeconds / 60);
            const secs = remainingSeconds % 60;
            document.getElementById('timer-display').textContent = mins > 0 ? mins + ':' + (secs < 10 ? '0' : '') + secs : secs;
        }

        function adjustTimer(amount) {
            remainingSeconds = Math.max(0, remainingSeconds + amount);
            updateTimerDisplay();
            if (remainingSeconds <= 0) stopTimer();
        }

        function stopTimer() {
            if (activeTimerInterval) clearInterval(activeTimerInterval);
            document.getElementById('timer-card').classList.add('hidden');
        }

        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 587.33;
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.4);
            } catch (err) {}
        }

        function exportCSV() {
            let csv = 'ExerciseID,Day,Date,Weight,Reps\n';
            for (const [id, logs] of Object.entries(workoutLogs)) {
                logs.forEach(l => {
                    csv += `"${id}","${l.day}","${l.date}",${l.weight},${l.reps}\n`;
                });
            }
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'atg_workout_logs_' + new Date().toISOString().slice(0,10) + '.csv');
            a.click();
        }

        window.onload = init;
    </script>
</body>
</html>
