<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ATG + BTB Workout Tracker</title>
    <!-- PWA Manifest & Meta -->
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATG Tracker">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc',
                            muted: '#94a3b8'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-dark-text min-h-screen font-sans antialiased pb-24 select-none">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-dark-card/90 backdrop-blur-md border-b border-dark-border px-4 py-3">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div>
                <h1 class="text-lg font-bold tracking-tight text-white flex items-center gap-2">
                    <span>⚡</span> ATG + BTB Logger
                </h1>
                <p class="text-xs text-dark-muted" id="header-subtitle">Select your workout day</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="exportCSV()" class="px-2.5 py-1.5 bg-dark-border hover:bg-slate-700 text-white rounded-lg text-xs font-medium transition active:scale-95 flex items-center gap-1">
                    <span>📥</span> CSV
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto px-4 pt-4">

        <!-- Day Selector Tabs -->
        <div class="grid grid-cols-3 gap-2 mb-5 bg-dark-card p-1.5 rounded-2xl border border-dark-border">
            <button onclick="switchDay('monday')" id="tab-monday" class="py-2.5 text-xs font-bold rounded-xl transition text-center shadow-sm">Monday</button>
            <button onclick="switchDay('thursday')" id="tab-thursday" class="py-2.5 text-xs font-bold rounded-xl transition text-center shadow-sm">Thursday</button>
            <button onclick="switchDay('friday')" id="tab-friday" class="py-2.5 text-xs font-bold rounded-xl transition text-center shadow-sm">Friday</button>
        </div>

        <!-- Workout Routine Container -->
        <div id="exercise-list" class="space-y-3.5">
            <!-- Dynamically populated -->
        </div>

    </main>

    <!-- Rest Timer Floating Card -->
    <div id="timer-card" class="fixed bottom-4 left-4 right-4 max-w-md mx-auto bg-slate-900/95 backdrop-blur-xl border border-sky-500/30 rounded-2xl p-3 shadow-2xl z-50 flex items-center justify-between hidden transition-all duration-300">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center font-bold text-lg" id="timer-display">90</div>
            <div>
                <p class="text-xs font-semibold text-white" id="timer-label">Rest Timer</p>
                <p class="text-[10px] text-dark-muted">Tap to adjust</p>
            </div>
        </div>
        <div class="flex items-center gap-1.5">
            <button onclick="adjustTimer(-15)" class="w-8 h-8 rounded-lg bg-dark-border text-white text-xs font-bold active:scale-95">-15s</button>
            <button onclick="adjustTimer(15)" class="w-8 h-8 rounded-lg bg-dark-border text-white text-xs font-bold active:scale-95">+15s</button>
            <button onclick="stopTimer()" class="px-3 h-8 rounded-lg bg-rose-500/20 text-rose-400 hover:bg-rose-500/30 text-xs font-bold active:scale-95">Stop</button>
        </div>
    </div>

    <!-- Log Modal -->
    <div id="log-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
        <div class="bg-dark-card border border-dark-border w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-base font-bold text-white" id="modal-exercise-title">Exercise Name</h3>
                    <p class="text-xs text-dark-muted" id="modal-exercise-target">Target: 3 × 8-10</p>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-dark-border/50 text-dark-muted hover:text-white flex items-center justify-center text-sm font-bold">✕</button>
            </div>

            <div id="last-log-hint" class="mb-4
